[package]
name = "photohistory"
version = "1.0.0"
edition = "2021"
description = "Фотоархив — liquid glass photo history (desktop, Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"

[profile.release]
strip = true
