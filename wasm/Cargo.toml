[package]
name = "photo_history_wasm"
version = "1.0.0"
edition = "2021"
description = "EXIF / container metadata parsing for photoHistory (Next.js + Rust via WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
kamadak-exif = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
